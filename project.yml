name: XRPAlertsPro
options:
  bundleIdPrefix: com.gexiro
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
    CODE_SIGN_STYLE: Manual
  configs:
    Debug:
      CODE_SIGN_IDENTITY: Apple Development
      APS_ENVIRONMENT: development
    Release:
      CODE_SIGN_IDENTITY: Apple Distribution
      APS_ENVIRONMENT: production
targets:
  XRPAlertsPro:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: WebBundle
        type: folder
    dependencies:
      - target: XRPWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gexiro.xrpalertspro
        MARKETING_VERSION: 3.22.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: App/Info.plist
        SWIFT_VERSION: 5.0
        CODE_SIGN_ENTITLEMENTS: App/XRPAlertsPro.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROVISIONING_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  XRPWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gexiro.xrpalertspro.widget
        MARKETING_VERSION: 3.22.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Widget/Info.plist
        SWIFT_VERSION: 5.0
        CODE_SIGN_ENTITLEMENTS: Widget/XRPWidgetExtension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(WIDGET_PROVISIONING_PROFILE)
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
